[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hmda-project"
version = "0.1.0"
description = "Reusable infrastructure for the HMDA New York research project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31,<7",
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hmda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires an external service or multi-component test environment",
]
