status: configured_pending_db_verification
schema_version: hmda-postgres-v1
migration_directory: sql/migrations
compatibility:
  minimum_postgresql_major: 14
  verified_server_version: "18.6"
  verified_at: "2026-09-11"
connection:
  host:
    env: HMDA_DB_HOST
    required: false
    secret: false
    default: null
  port:
    env: HMDA_DB_PORT
    required: false
    secret: false
    default: "5432"
  database:
    env: HMDA_DB_NAME
    required: false
    secret: false
    default: null
  username:
    env: HMDA_DB_USER
    required: false
    secret: false
    default: null
  password:
    env: HMDA_DB_PASSWORD
    required: false
    secret: true
    default: null
  sslmode:
    env: HMDA_DB_SSLMODE
    required: false
    secret: false
    default: require
  channel_binding:
    env: HMDA_DB_CHANNEL_BINDING
    required: false
    secret: false
    default: require

schemas:
  staging: hmda_staging
  raw: hmda_raw
  audit: hmda_audit
roles:
  migrator: hmda_migrator
  ingest: hmda_ingest
  reader: hmda_reader
